<!doctype html>
<html lang="es">
  <head>
    <!-- ========== 1. METADATOS ========== -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luis Guillen</title>
    <!-- TODO: mejora el title con tu rol (ej. "Luis Guillen | ...") -->
    <!-- TODO: agrega la meta description con una frase sobre ti -->
    <!-- TODO: agrega el favicon (img/favicon/) -->

    <!-- ========== 2. TIPOGRAFÍA (Google Fonts) ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ========== 3. ESTILOS ========== -->
    <!-- normalize.css primero: iguala los estilos por defecto de todos los navegadores -->
    <link href="css/normalize.css" rel="stylesheet" />
    <!-- Mis estilos al final, para que ganen en la cascada -->
    <link href="css/style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- ==================== ENCABEZADO ==================== -->
    <header class="header">
      <nav class="header__nav">
        <!-- Logo: una sola imagen SVG que ya incluye símbolo + nombre -->
        <a href="#inicio" class="header__marca">
          <img
            src="img/luis-guillen/luis-guillen-horizontal-oscuro.svg"
            alt="Luis Guillen, inicio"
            class="header__logo"
          />
        </a>

        <!-- Menú: cada enlace apunta al id de su sección -->
        <ul class="header__menu">
          <li class="header__item">
            <a href="#inicio" class="header__link">Inicio</a>
          </li>
          <li class="header__item">
            <a href="#sobre-mi" class="header__link">Sobre mí</a>
          </li>
          <li class="header__item">
            <a href="#proyectos" class="header__link">Proyectos</a>
          </li>
          <li class="header__item">
            <a href="#documentacion" class="header__link">Documentación</a>
          </li>
          <li class="header__item">
            <a href="#blog" class="header__link">Blog</a>
          </li>
          <li class="header__item">
            <a href="#contacto" class="header__link">Contacto</a>
          </li>
        </ul>

        <!-- Acciones: modo claro/oscuro y CV -->
        <div class="header__acciones">
          <button
            id="cambiarColorFondo"
            class="boton-tema"
            type="button"
            aria-label="Cambiar entre modo claro y oscuro"
          >
            Cambiar color de fondo
          </button>
          <!-- TODO: sube tu cv.pdf a la raíz del proyecto -->
          <a
            href="cv.pdf"
            download="cv-luis-guillen.pdf"
            class="boton boton--naranja"
            >Descargar CV</a
          >
        </div>
      </nav>
    </header>

    <!-- TODO: crea aquí una <section> con id para cada enlace del menú
         (inicio, sobre-mi, proyectos, documentacion, blog, contacto) -->

    <!-- ========== SCRIPTS ========== -->
    <!-- Aquí irá tu js/main.js cuando empecemos JavaScript -->
  </body>
</html>
